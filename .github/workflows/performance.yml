name: Browser performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: macos-26
    timeout-minutes: 80
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BOWSER_TELEMETRY_DISABLED: '1'
      BOWSER_PERF_SESSION: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      BOWSER_PERF_HARNESS: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set performance stage path
        run: echo "BOWSER_STAGE_FILE=$RUNNER_TEMP/performance-stage" >> "$GITHUB_ENV"
      - name: Install Elixir
        run: brew install elixir
      - name: Test budget enforcement
        run: python3 -m unittest discover -s tests/performance -p 'test*.py'
      - name: Test page-hook responsiveness and observer recovery
        env:
          BOWSER_HOME: ${{ runner.temp }}/observer-test-home
        run: swift test --package-path shell --filter ModScriptTests
      - name: Select pinned base revision
        id: base
        run: python3 tests/performance/ci_reference.py
      - name: Check out base source for measurement
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: .performance-base
          persist-credentials: false
      - name: Use identical benchmark workloads for both revisions
        run: python3 tests/performance/ci_reference.py .performance-base
      - name: Build base release stage
        working-directory: .performance-base
        env:
          BOWSER_SIGN_IDENTITY: '-'
          BOWSER_STAGE_FILE: ${{ runner.temp }}/performance-base-stage
        run: bin/install --stage-only
      - name: Build candidate release stage
        env:
          BOWSER_SIGN_IDENTITY: '-'
        run: bin/install --stage-only
      - name: Measure base on this runner
        id: reference
        continue-on-error: true
        working-directory: .performance-base
        env:
          BOWSER_PERF_SOURCE: ${{ steps.base.outputs.sha }}
        run: python3 tests/performance/run.py --reference --stage "$(cat "$RUNNER_TEMP/performance-base-stage")" --output "$RUNNER_TEMP/performance-base"
      - name: Compare candidate and enforce absolute budgets
        id: candidate
        continue-on-error: true
        env:
          BOWSER_PERF_SOURCE: ${{ github.sha }}
        run: bin/check-performance --stage "$(cat "$BOWSER_STAGE_FILE")" --output "$RUNNER_TEMP/performance" --baseline "$RUNNER_TEMP/performance-base/report.json"
      - name: Confirm relative regression with reversed measurement order
        if: steps.candidate.outcome == 'failure' && steps.reference.outcome == 'success'
        env:
          BOWSER_PERF_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python3 tests/performance/confirm.py --primary "$RUNNER_TEMP/performance/report.json" --candidate-stage "$(cat "$BOWSER_STAGE_FILE")" --base-stage "$(cat "$RUNNER_TEMP/performance-base-stage")" --base-source "$BOWSER_PERF_BASE_SHA" --base-root "$GITHUB_WORKSPACE/.performance-base" --output-root "$RUNNER_TEMP"
      - name: Require successful candidate measurement
        if: steps.candidate.outcome == 'failure' && steps.reference.outcome != 'success'
        run: |
          echo 'Candidate comparison failed without a complete reference.' >&2
          exit 1
      - name: Require successful reference collection
        if: always() && steps.reference.outcome == 'failure'
        run: |
          echo 'Reference measurement failed; comparison is incomplete.' >&2
          exit 1
      - name: Enable Safari testing on the disposable runner
        run: sudo /usr/bin/safaridriver --enable
      - name: Compare identical rendering workloads with Safari
        run: bin/compare-safari --stage "$(cat "$BOWSER_STAGE_FILE")" --output "$RUNNER_TEMP/safari-comparison"
      - name: Upload timings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/performance/
            ${{ runner.temp }}/performance-base/
            ${{ runner.temp }}/performance-confirm/
            ${{ runner.temp }}/performance-base-confirm/
            ${{ runner.temp }}/performance-confirm-summary.md
            ${{ runner.temp }}/safari-comparison/
          retention-days: 14
