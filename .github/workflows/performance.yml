name: Browser performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      BOWSER_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Elixir
        run: brew install elixir
      - name: Test budget enforcement
        run: python3 -m unittest discover -s tests/performance -p test_report.py
      - name: Restore trusted main baseline
        uses: actions/cache/restore@v4
        with:
          path: .performance-baseline/report.json
          key: performance-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: performance-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run release performance budgets
        run: bin/check-performance --output "$RUNNER_TEMP/performance" --baseline .performance-baseline/report.json
      - name: Save passing main baseline
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p .performance-baseline
          cp -f "$RUNNER_TEMP/performance/report.json" .performance-baseline/report.json
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .performance-baseline/report.json
          key: performance-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Upload timings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance/
          retention-days: 14
